# ---------------------------------------------------------------------------
# INTELIGENCIAS ARTIFICIALES — español.
#
# `items` es la lista de herramientas de IA. Para añadir una, copia un bloque
# completo respetando la indentación.
#
# Campos de cada herramienta:
#   name        → nombre visible
#   category    → etiqueta corta que aparece arriba a la derecha
#   description → para qué la usa
#   level       → dominio de 0 a 100 (es lo que llena la barra)
#   brand       → logo de la herramienta. Los nombres disponibles están en
#                 `src/components/ui/brands.jsx`
#   url         → enlace a la herramienta (opcional: sin él la tarjeta no
#                 enlaza a ninguna parte)
# ---------------------------------------------------------------------------

eyebrow: Inteligencia artificial
title: Las IA que uso a diario
lead: >-
  Herramientas de inteligencia artificial que forman parte de mi flujo de
  trabajo, del análisis y la escritura de código al diseño visual.

levelLabel: Dominio

items:
  - name: Claude
    category: Conversacional
    description: IA de Anthropic para análisis, desarrollo de código y redacción técnica.
    level: 90
    brand: claude
    url: https://claude.ai

  - name: ChatGPT
    category: Conversacional
    description: Asistente de IA para generación de texto, código y análisis.
    level: 85
    brand: chatgpt
    url: https://chatgpt.com

  - name: Gemini
    category: Conversacional
    description: IA multimodal de Google para texto, código e imágenes.
    level: 80
    brand: gemini
    url: https://gemini.google.com

  - name: Midjourney
    category: Generación de imágenes
    description: IA generativa para creación de imágenes artísticas y diseño visual.
    level: 75
    brand: midjourney
    url: https://www.midjourney.com

  - name: Perplexity
    category: Búsqueda
    description: Motor de búsqueda potenciado por IA, con fuentes citadas.
    level: 70
    brand: perplexity
    url: https://www.perplexity.ai
