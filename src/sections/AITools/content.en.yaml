# ---------------------------------------------------------------------------
# ARTIFICIAL INTELLIGENCE — English.
#
# `items` is the list of AI tools. To add one, copy a whole block keeping the
# indentation.
#
# Fields for each tool:
#   name        → visible name
#   category    → short label shown at the top right
#   description → what it is used for
#   level       → proficiency from 0 to 100 (this fills the bar)
#   brand       → tool logo. Available names live in
#                 `src/components/ui/brands.jsx`
#   url         → link to the tool (optional: without it the card doesn't link
#                 anywhere)
# ---------------------------------------------------------------------------

eyebrow: Artificial intelligence
title: The AI tools I use daily
lead: >-
  Artificial intelligence tools that are part of my workflow, from analysis and
  writing code to visual design.

levelLabel: Proficiency

