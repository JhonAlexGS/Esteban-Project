# ---------------------------------------------------------------------------
# STACK TÉCNICO — español.
#
# Cada bloque de `groups` es una tarjeta con su lista de habilidades y el nivel
# de dominio de cada una (la barra de progreso).
#
# Campos de cada habilidad:
#   name  → nombre visible
#   level → dominio de 0 a 100 (es lo que llena la barra)
#   brand → logo de la tecnología (opcional). Los nombres disponibles están en
#           `src/components/ui/brands.jsx`; si una habilidad no es un producto
#           concreto (por ejemplo «Control industrial»), se deja sin `brand`.
#
# `icon` es el ícono de la tarjeta y acepta: terminal, layers, devops, cloud,
# server, database, tool, cpu, shield, sun, code, radio, globe, book, award.
# ---------------------------------------------------------------------------

