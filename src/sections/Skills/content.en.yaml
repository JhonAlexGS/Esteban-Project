# ---------------------------------------------------------------------------
# TECH STACK — English.
#
# Each block in `groups` is a card with its list of skills and the proficiency
# level of each one (the progress bar).
#
# Fields for each skill:
#   name  → visible name
#   level → proficiency from 0 to 100 (this fills the bar)
#   brand → technology logo (optional). Available names live in
#           `src/components/ui/brands.jsx`; skills that aren't a specific
#           product (e.g. "Industrial control") are left without `brand`.
#
# `icon` is the card icon and accepts: terminal, layers, devops, cloud, server,
# database, tool, cpu, shield, sun, code, radio, globe, book, award.
# ---------------------------------------------------------------------------

