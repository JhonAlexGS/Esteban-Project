# ---------------------------------------------------------------------------
# PROYECTOS DESTACADOS — español.
# `items` es la lista de tarjetas. Para añadir un proyecto, copia un bloque
# completo respetando la indentación.
#
# Campos de cada proyecto:
#   title    → nombre del proyecto
#   kicker   → categoría corta que se muestra arriba
#   period   → fechas
#   summary  → descripción (admite **negritas** de Markdown)
#   metrics  → cifras destacadas (opcional, máximo 2)
#   tags     → tecnologías
#   icon     → cpu, radio, code, database, cloud, shield, server, terminal,
#              tool, sun, book...
#   size     → hero | tall | wide  (controla el tamaño en la grilla)
#   links    → lista de enlaces, cada uno con `label` y `url`.
#              Puedes poner varios (repo, demo, sitio…) o ninguno:
#              si la lista está vacía, la tarjeta simplemente no muestra
#              botones. El `label` es el texto visible, cámbialo a tu gusto.
# ---------------------------------------------------------------------------

eyebrow: Proyectos destacados
title: Soluciones que llevan la ingeniería a la práctica
lead: >-
  Inteligencia artificial, energía renovable, presencia web y formación en
  robótica: los proyectos que mejor resumen cómo trabajo.

items:
  - id: ia-procesos
    title: Inteligencia artificial para optimizar procesos
    kicker: IA aplicada · Grupo Empresarial Colombia GED
    period: Oct 2023 – Ago 2026
    icon: cpu
    size: hero
    links: []
    summary: >-
      Implementación de **soluciones con inteligencia artificial** para la
      optimización de procesos en la empresa. Un trabajo que se cruza con la
      **Maestría en IA**, donde las aptitudes centrales son **machine
      learning**, **procesamiento de datos**, **visión artificial** y
      **automatización con IA**.
    tags: [Python, Machine Learning, Visión artificial, Procesamiento de datos, Automatización con IA]

  - id: energia-solar
