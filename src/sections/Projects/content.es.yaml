    icon: sun
    size: tall
    links: []
    summary: >-
      **Instalación y soporte técnico** de sistemas **fotovoltaicos**,
      respaldados por la certificación en Sistemas Fotovoltaicos con
      estándares **NABCEP** (La Escuela Casa Solar, 2024).
    tags: [Sistemas fotovoltaicos, Diseño de instalaciones, Redes eléctricas, NABCEP]

  - id: sitios-corporativos
    title: Páginas web corporativas
