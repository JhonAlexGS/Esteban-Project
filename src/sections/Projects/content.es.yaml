# ---------------------------------------------------------------------------
# PROYECTOS DESTACADOS — español.
# `items` es la lista de tarjetas. Para añadir un proyecto, copia un bloque
# completo respetando la indentación.
#
# Campos de cada proyecto:
#   title    → nombre del proyecto
#   kicker   → categoría corta que se muestra arriba
#   period   → fechas
#   summary  → descripción (admite **negritas** de Markdown)
#   metrics  → cifras destacadas (opcional, máximo 2)
#   tags     → tecnologías
#   icon     → cpu, radio, code, database, cloud, shield, server, terminal,
#              tool, sun, book...
#   size     → hero | tall | wide | full  (controla el tamaño en la grilla)
#   links    → lista de enlaces, cada uno con `label` y `url`.
#              Puedes poner varios (repo, demo, sitio…) o ninguno:
#              si la lista está vacía, la tarjeta simplemente no muestra
#              botones. El `label` es el texto visible, cámbialo a tu gusto.
# ---------------------------------------------------------------------------

