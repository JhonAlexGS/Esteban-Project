items:
  - title: MultiSort-AI-APP
    kicker: Master's thesis · Applied AI at GED
    period: MSc in AI · 2026
    summary: >-
      An artificial intelligence application built for Grupo Empresarial
      Colombia GED as a thesis project: it classifies and organizes large
      volumes of images with filters and segmentation, and adds an image
      generation and editing mode. It is internal software and runs locally.
    tags: [Python, Computer vision, Segmentation, Generative AI]
    images:
      - file: proyectos/multisort-clasificacion.webp
        name: Image classification and sorting
        note: >-
          Main screen: you pick the input folder, the formats to include and
          the output folder. Classification can be automatic or by category.
      - file: proyectos/multisort-generacion.webp
        name: Image generation
        note: >-
          The app's second mode: text-to-image generation, transformations and
          upscaling.

  - title: Master's in AI projects
    kicker: AI and optimization · Academic projects
    period: MSc in AI · 2024 – 2026
    summary: >-
      Two exercises from the master's where the theory had to actually run: a
      vacuum that looks for the best route with the energy it has left, and a
      car detector working live on the camera feed.
    tags: [Python, Search and optimization, Computer vision, YOLOv5]
    images:
      - file: proyectos/aspiradora.webp
        name: Smart vacuum cleaner
        note: >-
          A vacuum that travels a grid environment through nodes, spots the
          cells it still has to visit and collects the dirt along the way.
          Energy is limited and drains with every move and every pickup, so the
          challenge is optimizing the route to cover as much area as possible
          before running out.
      - file: proyectos/deteccion-carros.webp
        name: Car detection
        note: >-
          Real-time object detection over the camera feed: the model draws a
          box around each car with its confidence score, processing frame by
          frame.

  - title: Corporate websites
    kicker: Web development · GED and AXCOR
    period: Dec 2022 – Aug 2026
    summary: >-
      Development and maintenance of the corporate websites of both companies
      I worked for, alongside support for social media and the digital
      marketing strategies behind their positioning.
    tags: [HTML/CSS, JavaScript, Adobe Dreamweaver, Digital marketing]
    images:
      - file: proyectos/web-ged.webp
        name: GED website
        note: >-
          Home page of Grupo Empresarial Colombia GED, covering its renewable
          energy, eco-friendly packaging, environmental engineering and
          advertising lines.
      - file: proyectos/web-axcor-inicio.webp
        name: AXCOR website
        note: AXCOR's home page.
      - file: proyectos/web-axcor-garantias.webp
        name: AXCOR warranty system
        note: >-
          Warranty tracking board: each order with its customer, item, validity
          and current status.

  - title: Teaching educational robotics
    kicker: Teaching · Colegio Enrique Olaya Herrera
    period: Aug 2022 – Dec 2022
    summary: >-
      A C++ programming logic course and hands-on training on
      microcontrollers. With the students we took part in a line-follower
      contest and worked through the systems of a submarine: radar, motor and
      lights.
    tags: [Robotics, C++, Arduino, Microcontrollers]
    images:
      - file: proyectos/colegio-seguidor.webp
        name: Line follower
        note: The contest robot, built and programmed with the students.
      - file: proyectos/colegio-submarino.webp
