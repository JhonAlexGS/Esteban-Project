# ---------------------------------------------------------------------------
# FEATURED PROJECTS — English.
# `items` is the list of cards. To add a project, copy a whole block keeping
# the indentation.
#
# Fields for each project:
#   title    → project name
#   kicker   → short category shown on top
#   period   → dates
#   summary  → description (supports Markdown **bold**)
#   metrics  → highlighted figures (optional, 2 at most)
#   tags     → technologies
#   icon     → cpu, radio, code, database, cloud, shield, server, terminal,
#              tool, sun, book...
#   size     → hero | tall | wide  (controls the size in the grid)
#   links    → list of links, each with `label` and `url`.
#              Add several (repo, demo, site…) or none: with an empty list
#              the card simply shows no buttons.
# ---------------------------------------------------------------------------

