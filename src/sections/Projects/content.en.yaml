        note: Submarine model with its radar, motor and lighting systems.
      - file: proyectos/colegio-esquema-submarino.webp
        name: Submarine system diagram
        note: Diagram of how each of the submarine's systems works.
      - file: proyectos/colegio-carrito.webp
        name: Remote-controlled car
        note: A remote-controlled vehicle built in class.
      - file: proyectos/colegio-lego.webp
        name: Lego architecture
        note: A construction and mechanical design exercise with Lego bricks.
      - file: proyectos/colegio-ultrasonido.webp
